[build]
publish = "_site"
command = "npm run build"
functions = "netlify/functions"

[dev]
command = "npx eleventy --watch"
framework = "#static"
autoLaunch = false

[build.environment]
  TZ = "Europe/Brussels"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/"
  to = "/2022/"

[[redirects]]
  from = "/t2"
  to = "/2022/"

[[redirects]]
  from = "/research-week/2026/slarg-research-exhibition-28-october-–-1-november/"
  to = "/research-week/2026/slarg-research-exhibition/"
  status = 301

[[redirects]]
  from = "/research-week/2026/slarg-research-exhibition-28-october-%E2%80%93-1-november/"
  to = "/research-week/2026/slarg-research-exhibition/"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

